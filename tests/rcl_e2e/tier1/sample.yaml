sample:
  name: Zenbedded RCL e2e tier1 test
common:
  tags: zenoh
tests:
  sample.zenbedded.rcl_e2e_tier1.build:
    build_only: true
    platform_allow:
      - native_sim/native/64
      - esp32s3_devkitc/esp32s3/procpu

  sample.zenbedded.rcl_e2e_tier1.native_sim:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    harness_config:
      pytest_dut_scope: function
      pytest_args: ["-o", "env=PYTEST_DISABLE_PLUGIN_AUTOLOAD=1"]
