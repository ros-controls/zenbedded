sample:
  name: Zenbedded RCL e2e tier2 test
common:
  tags: zenoh
tests:
  sample.zenbedded.rcl_e2e_tier2:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ZENBEDDED_TRANSPORT_DYNAMIC_PORT_OVERRIDE=y
    harness_config:
      pytest_dut_scope: function
      pytest_args: ["-o", "env=PYTEST_DISABLE_PLUGIN_AUTOLOAD=1"]
