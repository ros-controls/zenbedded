sample:
  name: Zenbedded CDR Integration Test
common:
  tags: zenoh
tests:
  sample.zenbedded.transport.asan:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ASAN=y
      - CONFIG_UBSAN=y

  sample.zenbedded.transport.e2e:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ZENBEDDED_TRANSPORT_DYNAMIC_PORT_OVERRIDE=y
    harness_config:
      pytest_dut_scope: function
      pytest_args: ["-o", "env=PYTEST_DISABLE_PLUGIN_AUTOLOAD=1"]
