name: Zephyr Twister

on:
  pull_request:
    paths: &zephyr_twister_paths
      - 'demos/**'
      - 'zenbedded_rcl/**'
      - 'zenbedded_transport/**'
      - 'zephyr/**'
      - 'tests/**'
      - 'compose.yaml'
      - 'README.md'
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/zephyr-twister.yml'
  push:
    branches:
      - master
    paths: *zephyr_twister_paths
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and test
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads') }}

jobs:
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: ${{ inputs.image_tag }}

  twister:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.docker.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build external Zephyr module consumer
        shell: bash
        run: |
          export ZEPHYR_BASE=/zephyr_ws/zephyr
          export ZENBEDDED_MODULE_ROOT="$GITHUB_WORKSPACE"
          cp -a "$GITHUB_WORKSPACE/tests/zephyr_module" "$RUNNER_TEMP/zenbedded-consumer"
          "$ZEPHYR_BASE/scripts/twister" \
            --testsuite-root "$RUNNER_TEMP/zenbedded-consumer" \
            --platform native_sim/native/64 \
            --platform esp32s3_devkitc/esp32s3/procpu \
            --inline-logs \
            --outdir external-consumer-twister-out \
            --jobs 1

      - name: Build Colcon Packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          ln -sfn "$GITHUB_WORKSPACE/zenbedded_transport" /ros2_ws/src/zenbedded_transport
          cd /ros2_ws
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
          colcon build

      - name: Run twister (build + run native_sim)
        shell: bash
        run: |
          source /ros2_ws/install/setup.bash
          export ZEPHYR_BASE=/zephyr_ws/zephyr
          "$ZEPHYR_BASE/scripts/twister" \
            --testsuite-root demos \
            --platform native_sim/native/64 \
            --platform esp32s3_devkitc/esp32s3/procpu \
            --inline-logs \
            -v \
            --outdir twister-out \
            --jobs 1

      - name: Show twister run output
        if: always()
        shell: bash
        run: |
          echo "::group::Test summary (twister.log)"
          cat twister-out/twister.log || true
          echo "::endgroup::"
          find twister-out -name handler.log | while read -r log; do
            echo "::group::Device output — $log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload twister logs and configs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: |
            twister-out/**/*.log
            twister-out/**/.config
            twister-out/twister.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
