name: Zephyr Twister

on:
  workflow_dispatch:
  pull_request:
    paths: &zephyr_twister_paths
      - 'demos/**'
      - 'zenbedded_rcl/**'
      - 'zenbedded_transport/**'
      - '.github/workflows/zephyr-twister.yml'
  push:
    branches:
      - master
    paths: *zephyr_twister_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads') }}

jobs:
  twister:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/ros-controls/zephyr-zenoh-integration/zephyr-zenoh-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync west modules to this PR's manifest
        shell: bash
        run: |
          cp zenbedded_transport/west.yml /zephyr_ws/manifest-repo/zenbedded_transport.yml
          cp docker/image-west.yml        /zephyr_ws/manifest-repo/west.yml
          cd /zephyr_ws && west update zenoh-pico

      - name: Build Colcon Packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          ln -sfn "$GITHUB_WORKSPACE/zenbedded_transport" /ros2_ws/src/zenbedded_transport
          cd /ros2_ws
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
          colcon build

      - name: Run twister (build + run native_sim)
        shell: bash
        run: |
          source /ros2_ws/install/setup.bash
          export ZEPHYR_BASE=/zephyr_ws/zephyr
          "$ZEPHYR_BASE/scripts/twister" \
            --testsuite-root demos \
            --platform native_sim/native/64 \
            --platform esp32s3_devkitc/esp32s3/procpu \
            --inline-logs \
            -v \
            --outdir twister-out \
            --jobs 1

      - name: Show twister run output
        if: always()
        shell: bash
        run: |
          echo "::group::Test summary (twister.log)"
          cat twister-out/twister.log || true
          echo "::endgroup::"
          find twister-out -name handler.log | while read -r log; do
            echo "::group::Device output — $log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload twister logs and configs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: |
            twister-out/**/*.log
            twister-out/**/.config
            twister-out/twister.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
