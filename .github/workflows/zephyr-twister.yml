name: Zephyr Twister

on:
  pull_request:
    paths: &zephyr_twister_paths
      - 'demos/**'
      - 'tests/**'
      - 'zenbedded_rcl/**'
      - 'zenbedded_transport/**'
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/zephyr-twister.yml'
  push:
    branches:
      - master
    paths: *zephyr_twister_paths
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and test
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads') }}

jobs:
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_tag: ${{ inputs.image_tag }}

  twister:
    needs: docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [tests, demos]
    name: twister (${{ matrix.suite }})
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.docker.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_IGNOREOPTIONS: "-specs=* --specs=*"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.suite }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.suite }}-${{ github.ref_name }}-
            ccache-${{ matrix.suite }}-master-
            ccache-${{ matrix.suite }}-
            ccache-

      - name: Zero ccache statistics
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -z

      - name: Build Colcon Packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          ln -sfn "$GITHUB_WORKSPACE/zenbedded_transport" /ros2_ws/src/zenbedded_transport
          cd /ros2_ws
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
          colcon build

      - name: Run twister (${{ matrix.suite }})
        shell: bash
        run: |
          source /ros2_ws/install/setup.bash
          export ZEPHYR_BASE=/zephyr_ws/zephyr
          "$ZEPHYR_BASE/scripts/twister" \
            --testsuite-root ${{ matrix.suite }} \
            --platform native_sim/native/64 \
            --platform esp32s3_devkitc/esp32s3/procpu \
            --inline-logs \
            -v \
            --outdir twister-out

      - name: Show twister run output
        if: always()
        shell: bash
        run: |
          echo "::group::Test summary (twister.log)"
          cat twister-out/twister.log || true
          echo "::endgroup::"
          find twister-out -name handler.log | while read -r log; do
            echo "::group::Device output — $log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Print ccache statistics
        if: always()
        shell: bash
        run: |
          echo "::group::ccache statistics"
          ccache -s -v
          echo "::endgroup::"

      - name: Upload twister logs and configs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out-${{ matrix.suite }}
          path: |
            twister-out/**/*.log
            twister-out/**/.config
            twister-out/twister.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
