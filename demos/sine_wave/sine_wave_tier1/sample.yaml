sample:
  name: Sine Wave Tier1 demo
common:
  build_only: true
  tags: zenbedded
tests:
  sample.zenbedded.sine_wave_tier1.wifi:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    extra_args: SNIPPET=wifi
  sample.zenbedded.sine_wave_tier1.usb_cdc:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    extra_args: SNIPPET=cdc-ecm
  sample.zenbedded.sine_wave_tier1.dual:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    extra_args: SNIPPET="cdc-ecm;wifi"
