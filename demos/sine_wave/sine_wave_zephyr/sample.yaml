sample:
  name: Sine Wave Zephyr demo
common:
  build_only: true
  tags: zenbedded
tests:
  sample.zenbedded.sine_wave.wifi:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    extra_configs:
      - CONFIG_SINE_WAVE_COMM_USB_CDC=n
      - CONFIG_SINE_WAVE_COMM_WIFI=y
  sample.zenbedded.sine_wave.usb_cdc:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    extra_configs:
      - CONFIG_SINE_WAVE_COMM_USB_CDC=y
      - CONFIG_SINE_WAVE_COMM_WIFI=n
