CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_ZENBEDDED_TIER_1=y
CONFIG_ZENBEDDED_RCL=y
CONFIG_ZENBEDDED_RCL_PUB_TOPIC="/zenbedded/inverted_pendulum/state"
CONFIG_ZENBEDDED_RCL_SUB_TOPIC="/zenbedded/inverted_pendulum/cmd"

CONFIG_ZENBEDDED_NODE_NAME="inverted_pendulum"
CONFIG_ZENBEDDED_QOS_RELIABLE=y

CONFIG_INVERTED_PENDULUM_COMM_USB_CDC=y

# Quiet USB logging
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ECM_LOG_LEVEL_OFF=y

CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=2048
CONFIG_SHELL_STACK_SIZE=3072

# Disable verbose/noisy Wi-Fi, settings, and NVS logging
CONFIG_WIFI_CREDENTIALS_LOG_LEVEL_OFF=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_L2_WIFI_MGMT_LOG_LEVEL_ERR=y
CONFIG_NET_DHCPV4_LOG_LEVEL_ERR=y
CONFIG_SETTINGS_LOG_LEVEL_ERR=y
CONFIG_NVS_LOG_LEVEL_ERR=y

CONFIG_STEPPER=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_COUNTER=y
CONFIG_SNTP=y
