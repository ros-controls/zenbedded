controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    inverted_pendulum_controller:
      type: inverted_pendulum_controller/InvertedPendulumController

    inverted_pendulum_rl_controller:
      type: inverted_pendulum_rl_controller/InvertedPendulumRlController

inverted_pendulum_controller:
  ros__parameters:
    # -------------------------------------------------------------------------
    # Hardware interface names
    # -------------------------------------------------------------------------
    motor_joint_state_name:    "motor_joint/position"
    motor_joint_vel_name:      "motor_joint/velocity"
    pendulum_joint_state_name: "pendulum_joint/position"
    pendulum_joint_vel_name:   "pendulum_joint/velocity"
    motor_joint_command_name:  "motor_joint/acceleration"

    # -------------------------------------------------------------------------
    # Plant constants  (keep in sync with the mock hardware / URDF)
    # Changing these without re-solving the LQR degrades the balancer.
    # -------------------------------------------------------------------------
    m2:  0.014       # pendulum mass              [kg]
    l2:  0.051       # hinge -> COM               [m]
    L1:  0.062       # motor axis -> hinge        [m]
    J2:  4.447e-5    # pendulum hinge inertia     [kg·m²]
    g:   9.80665

    # -------------------------------------------------------------------------
    # LQR gains  u = -K * [q1, q1_dot, q2, q2_dot]
    #
    # Derived from:  Q = diag(5, 0.5, 80, 3),  R = 0.2
    # on the linearisation of the above plant about q2 = 0 (upright).
    #
    # Closed-loop eigenvalues: -14.49, -10.95, -1.76 ± 1.37i
    #
    # Note: k_q1 is NEGATIVE. The arm must move away from centre before it
    # can return, which is counter-intuitive but correct.
    # -------------------------------------------------------------------------
    k_q1:      -5.000
    k_q1_vel:  -4.352
    k_q2:     418.238
    k_q2_vel:  33.281

    # -------------------------------------------------------------------------
    # Swing-up (energy-shaping)
    #
    # The pump drives the pendulum's mechanical energy toward the upright
    # potential energy E_target = m2*g*l2.
    #
    #   u_pump = swing_accel_max * sign( -(E - E_target) * q2_dot * cos(q2) )
    #
    # BANG-BANG, not proportional. A proportional pump vanishes at rest and
    # produces ~8x LESS hinge torque than the bearing's Coulomb friction, so
    # the pendulum never starts moving. Saturated gives ~1300x and always does.
    # When |q2_dot| < swing_start_vel the sign is meaningless, so a fixed
    # kick seeds the first half-swing.
    # The arm-centering PD is always active and takes full authority when
    # |q1| > arm_zone (pump is zeroed in that case).
    #
    # Validated at 100 Hz ZOH (matching update_rate): 50/50 runs, ±2% plant
    # scatter, encoder noise, mock-hardware activation jitter.
    # Average first-catch 1.34 s; peak arm travel 80 deg (stops at 135).
    # -------------------------------------------------------------------------
    k_e:              80.0    # direction only; magnitude is swing_accel_max
    k_arm:            30.0    # arm P-recentering gain     [rad/s² per rad]
    k_arm_vel:         6.0    # arm D-recentering gain     [rad/s² per rad/s]
    swing_start_vel:  0.01    # dead-start kick threshold  [rad/s]
    swing_accel_max:  60.0    # pump saturation            [rad/s²]
    arm_zone:          2.0    # pump disabled beyond       [rad]  (~115 deg)

    # -------------------------------------------------------------------------
    # Mode transitions
    #
    # catch_angle is only a CANDIDATE window. The actual gate is on the LQR
    # command that state would produce: at the raw catch_angle edge (0.35 rad)
    # with zero velocity, k_q2 * catch_angle alone is ~98% of motor_accel_max
    # -- no margin left for velocity damping, sensor noise, or the control
    # loop's own actuation delay. Catching on position alone lets a noisy or
    # fast pass through the window saturate the command, fail to arrest the
    # swing, and fall straight back out: a catch/fall/re-swing oscillation
    # that a low-noise, zero-delay simulation will not show you.
    #
    # catch_cmd_fraction caps |u_lqr| as a fraction of motor_accel_max before
    # a catch is allowed; catch_ramp_steps blends the LQR command in linearly
    # over that many cycles afterward instead of a step change, since a real
    # stepper cannot track a step change in acceleration instantly.
    # -------------------------------------------------------------------------
    catch_angle:        0.35   # candidate window              [rad]  (~20 deg)
    fall_angle:          0.70  # exit LQR                       [rad]  (~40 deg)
    catch_cmd_fraction:  0.55  # max |u_lqr| / motor_accel_max to allow a catch
    catch_ramp_steps:     10.0   # cycles (~100 ms at 100 Hz) to blend in u_lqr

    # -------------------------------------------------------------------------
    # Safety
    # -------------------------------------------------------------------------
    motor_accel_max: 150.0  # hard clamp on u             [rad/s²]



# ---------------------------------------------------------------------------
# TRAINING (against mock_pendulum_hardware): leave enable_training true.
# ---------------------------------------------------------------------------
inverted_pendulum_rl_controller:
  ros__parameters:
    motor_joint_state_name: motor_joint/position
    motor_joint_vel_name: motor_joint/velocity
    pendulum_joint_state_name: pendulum_joint/position
    pendulum_joint_vel_name: pendulum_joint/velocity
    motor_joint_command_name: motor_joint/acceleration

    max_acceleration: 150.0
    enable_training: true

    actor_lr: 0.0001
    critic_lr: 0.001
    gamma: 0.99
    tau: 0.005
    exploration_noise_std: 0.1
    state_noise_std: 0.01
    reward_threshold: 18.0
    batch_size: 64
    min_buffer_size_to_train: 256
    replay_buffer_capacity: 100000
    episode_length: 1000
    mirror_augmentation: true

    actor_weights_path: ""  # empty -> random init
    weights_save_dir: "./rl_weights"

# ---------------------------------------------------------------------------
# DEPLOYMENT (against ZenbeddedHardware on the real robot): copy this block
# into a second yaml, point actor_weights_path at a checkpoint produced by
# training above (e.g. furuta_rl_weights/actor_final.bin or actor_best.bin),
# and set enable_training false so no critic/replay buffer is allocated and
# only the actor's forward pass runs each cycle.
# ---------------------------------------------------------------------------
# nn_furuta_rl_controller:
#   ros__parameters:
#     enable_training: false
#     actor_weights_path: "/path/to/furuta_rl_weights/actor_final.bin"
#     max_acceleration: 50.0
