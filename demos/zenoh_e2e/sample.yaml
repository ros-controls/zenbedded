sample:
  description: Configurable bidirectional Zenoh E2E string-message test
  name: zenoh e2e
common:
  harness: pytest
tests:
  sample.zenbedded.zenoh_e2e.ingress_frequent:
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ZENOH_E2E_INGRESS=y
      - CONFIG_ZENOH_E2E_EGRESS=n
      - CONFIG_ZENOH_E2E_PERIOD_MS=1000
    harness_config:
      pytest_dut_scope: function
      pytest_args:
        - '-p'
        - 'no:launch_testing'
        - '-p'
        - 'no:launch_ros'
        - '-k'
        - 'test_ingress_frequent'

  sample.zenbedded.zenoh_e2e.ingress_infrequent:
    platform_allow:
      - native_sim/native/64
    timeout: 125
    extra_configs:
      - CONFIG_ZENOH_E2E_INGRESS=y
      - CONFIG_ZENOH_E2E_EGRESS=n
      - CONFIG_ZENOH_E2E_PERIOD_MS=15000
    harness_config:
      pytest_dut_scope: function
      pytest_args:
        - '-p'
        - 'no:launch_testing'
        - '-p'
        - 'no:launch_ros'
        - '-k'
        - 'test_ingress_infrequent'

  sample.zenbedded.zenoh_e2e.ingress_after_lease_idle:
