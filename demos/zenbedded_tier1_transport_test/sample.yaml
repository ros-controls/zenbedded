sample:
  name: Zenbedded CDR Integration Test
common:
  tags: zenoh
tests:
  sample.zenbedded.transport.build:
    build_only: true
    platform_allow:
      - native_sim/native/64
      - esp32s3_devkitc/esp32s3/procpu

  sample.zenbedded.transport.asan:
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ASAN=y
      - CONFIG_UBSAN=y

  sample.zenbedded.transport.e2e:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    harness_config:
      pytest_dut_scope: function
      pytest_args: ["-o", "env=PYTEST_DISABLE_PLUGIN_AUTOLOAD=1", "-k", "-test_mcu_publishes_to_ros2 or test_ros2_commands_mcu"]

  sample.zenbedded.transport.ingress_only:
    harness: pytest
    platform_allow:
      - native_sim/native/64
    timeout: 150
    extra_configs:
      - CONFIG_TIER1_TEST_INGRESS=y
      - CONFIG_TIER1_TEST_EGRESS=n
    harness_config:
      pytest_dut_scope: function
      pytest_args: ["-o", "env=PYTEST_DISABLE_PLUGIN_AUTOLOAD=1", "-k", "test_ingress_only"]
